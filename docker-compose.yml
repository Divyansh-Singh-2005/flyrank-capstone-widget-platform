x-app: &app
  build: .
  image: flyrank-widget-platform:local
  env_file:
    - path: .env
      required: false
  environment: &app-env
    APP_ENV: ${APP_ENV:-development}
    JWT_SECRET: ${JWT_SECRET:-insecure-demo-jwt-secret-change-me}
    IP_HASH_SALT: ${IP_HASH_SALT:-insecure-demo-ip-hash-salt-change-me}
    TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-widget}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-widget_platform}
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-widget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-widget_platform}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-env
      EMAIL_MODE: smtp
      FORCE_EMAIL_FAILURE: ${FORCE_EMAIL_FAILURE:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  demo:
    image: python:3.12-slim
    command: ["python", "-m", "http.server", "5500", "--directory", "/site"]
    volumes:
      - ./demo-site:/site:ro
    ports:
      - "5500:5500"
    restart: unless-stopped

volumes:
  pgdata: